name: 트라이팟 일일 신호
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "변경 없어도 알림 보내기 (테스트)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 신호 판정 및 알림
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_NOTIFY: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python run_signal.py
      - name: 실행 기록 저장 (저장소 활동 유지)
        run: |
          git config user.name "tripod-bot"
          git config user.email "tripod-bot@users.noreply.github.com"
          git add last_signal.json
          git commit -m "signal $(date -u +%F)" || echo "변경 없음"
          git push
